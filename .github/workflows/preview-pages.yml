name: Deploy preview to GitHub Pages

# Publica una VISTA PREVIA del sitio en GitHub Pages (marcada noindex, no es
# el sitio final). El sitio real se despliega en el hosting definitivo del
# cliente (ver README.md) con su propio dominio.

on:
  push:
    branches: [claude/tecnissan-website-lcnpff]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site (preview base path)
        run: BASE_PATH=/${{ github.event.repository.name }} node build/build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "Preview URL ${{ steps.deployment.outputs.page_url }}"
