<section class="page-hero">
  <div class="container">
    {{BREADCRUMBS}}
    <p class="eyebrow">Galería</p>
    <h1>Trabajos realizados en Tecnissan</h1>
    <p>Nuestro taller, nuestro equipo y los vehículos que atendemos cada día en {{CITY}}.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="gallery-grid">
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/fachada-taller.jpg" width="1400" height="788" alt="Fachada del taller Tecnissan" loading="lazy">
        <figcaption>Fachada del taller</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/hero/equipo-tecnissan.jpg" width="760" height="1351" alt="Equipo completo de Tecnissan junto a un Nissan en el taller" loading="lazy">
        <figcaption>Nuestro equipo</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/equipo-tecnico.jpg" width="900" height="1600" alt="Técnicos especialistas de Tecnissan en uniforme" loading="lazy">
        <figcaption>Equipo técnico</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/area-de-trabajo.jpg" width="1200" height="1600" alt="Área de trabajo con varios vehículos en servicio" loading="lazy">
        <figcaption>Área de trabajo</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/sala-de-espera.jpg" width="1200" height="900" alt="Sala de espera de Tecnissan" loading="lazy">
        <figcaption>Sala de espera</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/valores-tecnissan.jpg" width="1200" height="1600" alt="Zona común con los valores corporativos de Tecnissan" loading="lazy">
        <figcaption>Nuestros valores</figcaption>
      </figure>
      <figure class="gallery-photo">
        <img src="/assets/img/gallery/oficina.jpg" width="1200" height="900" alt="Oficina administrativa de Tecnissan" loading="lazy">
        <figcaption>Oficina administrativa</figcaption>
      </figure>
    </div>

    <div class="cta-banner" style="margin-top:48px">
      <div class="cta-banner-info">
        <span class="cta-banner-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></span>
        <div>
          <p class="eyebrow">Síguenos</p>
          <h3>Más fotos en nuestro Instagram</h3>
          <p>Publicamos avances y trabajos terminados en nuestras redes sociales.</p>
        </div>
      </div>
      <a class="btn btn-dark" href="{{INSTAGRAM_URL}}" target="_blank" rel="noopener">Ver Instagram {{INSTAGRAM_HANDLE}}</a>
    </div>
  </div>
</section>
