  <rect y="690" width="1920" height="390" fill="url(#floor)"/>
  <g stroke="#5FD0FF" stroke-opacity="0.07" stroke-width="2">
    <path d="M-400 1080 L760 690"/><path d="M120 1080 L880 690"/>
    <path d="M640 1080 L1000 690"/><path d="M1160 1080 L1120 690"/>
    <path d="M1680 1080 L1240 690"/><path d="M2200 1080 L1360 690"/>
    <path d="M0 780 H1920" stroke-opacity="0.05"/>
    <path d="M0 880 H1920" stroke-opacity="0.04"/>
    <path d="M0 1000 H1920" stroke-opacity="0.03"/>
  </g>

  <g opacity="0.92">
