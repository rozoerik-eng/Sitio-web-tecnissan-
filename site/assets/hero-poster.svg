<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Bahia de servicio de Tecnissan en penumbra, con luz fria entrando de lado">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1726"/>
      <stop offset="0.55" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#060C15"/>
    </linearGradient>
    <radialGradient id="key" cx="0.3" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#8FDCFF" stop-opacity="0.30"/>
      <stop offset="0.38" stop-color="#5FD0FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#5FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFEEFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#CFEEFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1B2B"/>
      <stop offset="1" stop-color="#070E18"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD0FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#5FD0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5FD0FF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.48" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#key)"/>

  <g opacity="0.5" filter="url(#soft)">
    <polygon points="120,0 470,0 900,1080 250,1080" fill="url(#beam)"/>
