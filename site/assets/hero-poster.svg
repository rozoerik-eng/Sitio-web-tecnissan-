    <circle cx="524" cy="470" r="2" opacity="0.28"/><circle cx="742" cy="392" r="1.6" opacity="0.18"/>
    <circle cx="338" cy="560" r="2.2" opacity="0.24"/><circle cx="880" cy="286" r="1.5" opacity="0.16"/>
    <circle cx="960" cy="520" r="1.9" opacity="0.2"/><circle cx="256" cy="386" r="1.7" opacity="0.2"/>
