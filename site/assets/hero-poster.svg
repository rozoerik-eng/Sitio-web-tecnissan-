  <g opacity="0.5">
    <rect x="112" y="452" width="184" height="238" rx="10" fill="#0C1724"/>
    <path d="M112 452 H296" stroke="#5FD0FF" stroke-opacity="0.20" stroke-width="2"/>
    <rect x="132" y="486" width="144" height="8" rx="4" fill="#16243A"/>
